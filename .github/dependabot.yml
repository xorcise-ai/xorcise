# Dependency updates.
#
# The `github-actions` ecosystem is the security-critical one: every `uses:` is pinned to a
# commit SHA, and Dependabot is what stops those pins going stale. `ignore` only suppresses
# version-bump PRs — security alerts and fixes still arrive.
version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    # Supply-chain maturity window: never adopt a release in its first 7 days.
    #
    # The attack this blocks is a compromised or hijacked package publishing a malicious
    # version. Those are typically caught and yanked within hours-to-days, so the danger
    # window is the release's infancy — precisely when an eager auto-bump would take it.
    # Waiting lets the ecosystem find the problem for us; a version still standing after a
    # week has been exercised by thousands of other installs.
    #
    # This deliberately applies to VERSION updates only. GitHub does not apply cooldown to
    # Dependabot SECURITY updates, which is the behaviour we want: a fix for a known CVE
    # must not sit in a queue for a week. Fast for fixes, patient for features.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # opentelemetry-proto is pinned exactly: it decodes the OTLP wire format, so a mismatch
      # corrupts traces rather than raising an import error. Majors only — minor/patch still flow.
      - dependency-name: opentelemetry-*
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    # Supply-chain maturity window: never adopt a release in its first 7 days.
    #
    # The attack this blocks is a compromised or hijacked package publishing a malicious
    # version. Those are typically caught and yanked within hours-to-days, so the danger
    # window is the release's infancy — precisely when an eager auto-bump would take it.
    # Waiting lets the ecosystem find the problem for us; a version still standing after a
    # week has been exercised by thousands of other installs.
    #
    # This deliberately applies to VERSION updates only. GitHub does not apply cooldown to
    # Dependabot SECURITY updates, which is the behaviour we want: a fix for a known CVE
    # must not sit in a queue for a week. Fast for fixes, patient for features.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # Packages that must move TOGETHER, majors included. A partial bump of either set is not
      # a smaller change than the whole one — it is a broken one, and Dependabot cannot know
      # that, so it is said here.
      #
      # react: `react` and `react-dom` must be on the same major (a 19 renderer against an 18
      # core is unsupported), and the two @types packages describe them. Bumped one at a time
      # they produce a PR that cannot pass; bumped together they produce a React migration PR
      # that can be reviewed as one.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      # test-toolchain: @vitejs/plugin-react peers on a specific Vite MAJOR (6.x wants
      # vite ^8), and this project has no direct Vite dependency — it gets Vite from vitest.
      # So the plugin can only move when vitest moves. Deliberately NOT including jsdom: it is
      # the DOM implementation the tests run against, versioned independently of Vite, and
      # coupling it here would hold a good jsdom bump behind a vitest major.
      test-toolchain:
        patterns:
          - vitest
          - "@vitejs/plugin-react"
      # Everything else, minor and patch only.
      frontend-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # @types/node must track the Node this project RUNS, never lead it: package.json
      # declares engines.node ">=22 <23" and .nvmrc pins 22. Types for a newer Node make
      # `tsc --noEmit` accept APIs that do not exist at runtime, which turns the typecheck
      # from evidence into noise. Raise this the same day engines.node moves, not before.
      # Minor/patch still flow, and `ignore` never suppresses security updates.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Grouped into one PR: a single reviewable PR actually gets merged, which is what keeps the
  # SHA pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    # Supply-chain maturity window: never adopt a release in its first 7 days.
    #
    # The attack this blocks is a compromised or hijacked package publishing a malicious
    # version. Those are typically caught and yanked within hours-to-days, so the danger
    # window is the release's infancy — precisely when an eager auto-bump would take it.
    # Waiting lets the ecosystem find the problem for us; a version still standing after a
    # week has been exercised by thousands of other installs.
    #
    # This deliberately applies to VERSION updates only. GitHub does not apply cooldown to
    # Dependabot SECURITY updates, which is the behaviour we want: a fix for a known CVE
    # must not sit in a queue for a week. Fast for fixes, patient for features.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - internal
    groups:
      github-actions:
        patterns:
          - "*"
