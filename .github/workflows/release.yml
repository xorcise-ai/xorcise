# Release pipeline.  Merging publishes nothing; pushing a `v*` tag does.
#
# Trust boundary — the only workflow that can write to the repo or reach PyPI:
#   * triggers ONLY on a pushed `v*` tag, restricted to maintainers by a tag ruleset;
#   * no `workflow_dispatch` — that would let anyone with write access publish from any ref;
#   * NO CACHING: caches are writable from other branches, so one poisoned in a PR context
#     must never reach a signed release artifact;
#   * built ONCE — every later job consumes that artifact, so the thing tested is the thing
#     published.
#
# PyPI auth is OIDC Trusted Publishing, bound to this repo + this filename + the `pypi`
# environment. Renaming this file breaks publishing. There is no token to leak.
name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  # Keyed to the tag. Never cancel — a half-cancelled publish is the worst state to be in.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.9.30"

jobs:
  # 1. BUILD — the single source of truth for what gets published.
  build:
    name: build + verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # mint the OIDC identity that signs the provenance attestation
      attestations: write # record the provenance attestation against this repository
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Not optional: a shallow clone yields a 0.1.dev0 version that fails the check below.
          fetch-depth: 0
          persist-credentials: false

      # Node must precede `uv build` — the hook builds the UI that ships in the wheel.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          # Omitting `cache:` is not enough — setup-node self-enables caching if package.json
          # ever gains a `packageManager` field.
          package-manager-cache: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      # Fail before building, so a malformed tag never produces artifacts.
      - name: Validate tag format
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # v<major>.<minor>.<patch> with an optional PEP 440 prerelease suffix (a1/b1/rc1).
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$'; then
            echo "::error::Tag '$TAG' is not a valid XORCISE release tag."
            echo "Expected: v0.1.0, v0.1.1, v0.2.0, or a prerelease such as v0.1.0rc1 / v0.1.0a1 / v0.1.0b1"
            exit 1
          fi
          echo "Tag format OK: $TAG"

      - name: Build sdist + wheel
        run: uv build

      # Reads the BUILT metadata, not git or the filename. PyPI is immutable — both checks
      # must happen before anything uploads.
      - name: Verify tag matches the built version, and no placeholders remain
        env:
          TAG: ${{ github.ref_name }}
        run: uv run python scripts/check_release_metadata.py --tag "$TAG" dist

      - name: Verify wheel contents (UI export, role manifest, migrations, mission base)
        run: uv run python scripts/check_wheel_contents.py dist

      - name: Validate package metadata (twine, strict)
        run: uv run twine check --strict dist/*

      - name: Install wheel into a clean environment and run the CLI
        run: |
          set -euo pipefail
          uv venv /tmp/release-smoke
          uv pip install --python /tmp/release-smoke/bin/python dist/*.whl
          /tmp/release-smoke/bin/xorcise --help

      # Release notes come from CHANGELOG.md, not from commit subjects.
      #
      # `--generate-notes` alone lists merged pull requests, which says nothing on a release
      # whose work landed as direct commits — v0.1.0's generated notes were 173 characters and
      # had to be pasted in by hand afterwards. The changelog is already written, already
      # reviewed, and already ships inside the sdist; it is the honest source.
      #
      # Extracted HERE rather than in the draft job because that job deliberately never checks
      # out (it consumes artifacts only), and because this job is already checked out AT THE TAG
      # — so the notes come from the same tree that produced the wheel.
      #
      # Falls back to generated notes rather than failing: a forgotten changelog entry should
      # not abort a release that has already built, verified and attested cleanly. A prerelease
      # (v1.2.3rc1) has no section of its own by convention, so it falls back to the base
      # version's (1.2.3) — the notes a reader wants when trying the candidate.
      - name: Extract release notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"                       # v0.1.0 -> 0.1.0
          base="${version%%[ab]*}"; base="${base%%rc*}"   # 0.1.0rc1 -> 0.1.0

          extract() {  # $1 = version string to look for
            awk -v v="$1" '
              $0 == "## [" v "]" || index($0, "## [" v "] ") == 1 { f=1; next }
              f && /^## \[/ { exit }
              f { print }
            ' CHANGELOG.md
          }

          mkdir -p notes
          extract "$version" > notes/release-notes.md
          if [ ! -s notes/release-notes.md ] && [ "$base" != "$version" ]; then
            echo "No [$version] section; falling back to the base version [$base]."
            extract "$base" > notes/release-notes.md
          fi

          if [ -s notes/release-notes.md ]; then
            echo "Release notes taken from CHANGELOG.md ($(wc -c < notes/release-notes.md) bytes)."
          else
            echo "::warning::No CHANGELOG section for $version — falling back to generated notes."
            rm -f notes/release-notes.md
          fi

      # The banner that opens the notes, drawn for this tag by scripts/release_banner.py (standard
      # library only). Rendered here for the same reason the notes are: this tree is the tag.
      # Best-effort: a release never waits on its artwork.
      - name: Render the release banner
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p notes
          if uv run python scripts/release_banner.py "$TAG" > notes/banner.svg; then
            echo "Release banner rendered for $TAG ($(wc -c < notes/banner.svg) bytes)."
          else
            rm -f notes/banner.svg
            echo "::warning::Could not render the release banner; the notes will open without one."
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: notes/
          retention-days: 30
          if-no-files-found: ignore   # absent => the draft job uses --generate-notes

      # Proof of which repo/workflow/commit produced these files (`gh attestation verify`).
      - name: Generate build provenance attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      # The one and only handoff — every downstream job consumes exactly these bytes.
      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 30
          if-no-files-found: error

  # 2. DRAFT RELEASE — invisible and deletable, so a downstream failure leaves nothing public
  # to retract. Published only after PyPI succeeds (or is deliberately skipped).
  github-release-draft:
    name: draft GitHub Release
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    permissions:
      contents: write # create the draft GitHub Release and upload its assets
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      # Kept OUT of dist/ deliberately: `gh release create ... dist/*` uploads everything in
      # that directory as a release asset, and the notes are the release body, not an asset.
      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true   # absent when CHANGELOG had no matching section
        with:
          name: release-notes
          path: notes

      # Host the banner where the notes can show it. A release attachment cannot be that place:
      # GitHub serves attachments as downloads (application/octet-stream), so an <img> of one is
      # broken, while a file on a branch is served as image/svg+xml. `release-assets` holds only
      # banners, starts with no history, and no workflow runs on it. Best-effort, like the render.
      - name: Publish the release banner
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ ! -s notes/banner.svg ]; then
            echo "No release banner was rendered; the notes open without one."
            exit 0
          fi
          branch=release-assets
          path="banners/$TAG.svg"

          publish() {
            # First use: start the branch with no history, holding only a README.
            if ! gh api "repos/$REPO/branches/$branch" --silent 2>/dev/null; then
              printf '%s\n' "# release-assets" "" \
                "Banners for the top of each release's notes, published by .github/workflows/release.yml." \
                "Nothing here is code, and nothing builds from this branch." > notes/readme.md
              tree=$(jq -n --rawfile c notes/readme.md \
                '{tree: [{path: "README.md", mode: "100644", type: "blob", content: $c}]}' \
                | gh api "repos/$REPO/git/trees" --input - --jq .sha) || return 1
              commit=$(jq -n --arg t "$tree" \
                '{message: "Start the release-assets branch", tree: $t, parents: []}' \
                | gh api "repos/$REPO/git/commits" --input - --jq .sha) || return 1
              jq -n --arg r "refs/heads/$branch" --arg s "$commit" '{ref: $r, sha: $s}' \
                | gh api "repos/$REPO/git/refs" --input - --silent || return 1
            fi
            # A re-run for the same tag replaces its banner, which the contents API allows only
            # with the current file's sha.
            current=$(gh api "repos/$REPO/contents/$path?ref=$branch" --jq .sha 2>/dev/null) || current=""
            base64 -w0 notes/banner.svg > notes/banner.b64
            jq -n --arg m "Banner for $TAG" --arg b "$branch" --rawfile c notes/banner.b64 --arg s "$current" \
              '{message: $m, branch: $b, content: $c} + (if $s == "" then {} else {sha: $s} end)' \
              | gh api -X PUT "repos/$REPO/contents/$path" --input - --silent
          }

          if publish; then
            url="https://raw.githubusercontent.com/$REPO/$branch/$path"
            printf '<p align="center"><img src="%s" width="880" alt="XORCISE %s"></p>\n\n' \
              "$url" "$TAG" > notes/banner.md
            echo "Release banner published: $url"
          else
            echo "::warning::Could not publish the release banner; the notes will open without one."
          fi

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Never silently replace an existing release — a human needs to look first.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::A GitHub Release already exists for tag '$TAG'."
            echo "Refusing to modify it. Inspect it first:"
            echo "  gh release view $TAG --repo $REPO"
            echo "If this is a re-run of a failed release, publish the existing draft by hand"
            echo "or delete it deliberately before re-running. Never republish a different"
            echo "artifact under a version that has already been released."
            exit 1
          fi

          # Prereleases are flagged so `latest` keeps pointing at the newest stable version.
          prerelease_flag=""
          if printf '%s' "$TAG" | grep -Eq '(a|b|rc)[0-9]+$'; then
            prerelease_flag="--prerelease"
            echo "Tag $TAG is a prerelease."
          fi

          # The banner when one was published, then the CHANGELOG body when the build job found
          # one, then generated notes. With a body, `--notes-file` becomes the release text and
          # `--generate-notes` appends GitHub's contributor/full-changelog footer under it, so
          # the hand-written section gains the compare link without losing its own words.
          mkdir -p notes
          : > notes/body.md
          if [ -s notes/banner.md ]; then
            cat notes/banner.md >> notes/body.md
          fi
          if [ -s notes/release-notes.md ]; then
            cat notes/release-notes.md >> notes/body.md
            echo "Release body: CHANGELOG section ($(wc -c < notes/release-notes.md) bytes) + generated footer."
          else
            echo "Release body: generated notes only (no CHANGELOG section for $TAG)."
          fi
          notes_flags="--generate-notes"
          if [ -s notes/body.md ]; then
            notes_flags="--notes-file notes/body.md --generate-notes"
          fi

          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$TAG" \
            --draft \
            $notes_flags \
            $prerelease_flag \
            dist/*

          echo "Draft release created for $TAG (not yet visible to users)."

  # 3. PyPI — gated twice: the `pypi` environment (reviewer + tag restrictions) and the
  # `PYPI_PUBLISH_ENABLED` variable. Unset the variable and this skips cleanly while the rest
  # of the pipeline still produces a GitHub Release — the intended first-rehearsal state.
  pypi:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, github-release-draft]
    if: vars.PYPI_PUBLISH_ENABLED == 'true'
    timeout-minutes: 30
    environment: pypi
    permissions:
      # Deliberately no `contents: read` — this job must not check out or rebuild anything.
      id-token: write # mint the OIDC token PyPI Trusted Publishing exchanges for upload rights
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: List artifacts to be published
        run: ls -l dist/

      # No token of any kind. The Trusted Publisher must match owner + repo + this filename
      # + environment exactly, or PyPI rejects it.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # 4. PUBLISH — last, so the announcement never precedes the package being installable.
  publish-github-release:
    name: publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, github-release-draft, pypi]
    # `always()` is needed because `pypi` legitimately skips when publishing is disabled.
    # The explicit condition below restores the safety that `always()` removes.
    if: >-
      always() &&
      needs.build.result == 'success' &&
      needs.github-release-draft.result == 'success' &&
      (needs.pypi.result == 'success' || needs.pypi.result == 'skipped')
    timeout-minutes: 15
    permissions:
      contents: write # flip the existing draft Release to published
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          PYPI_RESULT: ${{ needs.pypi.result }}
        run: |
          set -euo pipefail

          if [ "$PYPI_RESULT" = "skipped" ]; then
            echo "NOTE: PyPI publishing was disabled (PYPI_PUBLISH_ENABLED is not 'true')."
            echo "Publishing the GitHub Release only. Nothing was uploaded to PyPI."
          fi

          # A prerelease stays flagged as such so it does not become the repo's "Latest".
          extra=""
          if printf '%s' "$TAG" | grep -Eq '(a|b|rc)[0-9]+$'; then
            extra="--prerelease"
          fi

          gh release edit "$TAG" \
            --repo "$REPO" \
            --draft=false \
            $extra

          echo "Published GitHub Release $TAG"
          echo "  ${GITHUB_SERVER_URL}/${REPO}/releases/tag/${TAG}"

  # 5. FAILURE SIGNPOST. The dangerous state is "PyPI succeeded, Release did not publish" —
  # the instinctive fix (re-run, rebuild, re-tag) is exactly wrong, because that version is
  # already live and immutable.
  release-failed:
    name: release failed (recovery notes)
    runs-on: ubuntu-latest
    needs: [build, github-release-draft, pypi, publish-github-release]
    if: >-
      always() &&
      (needs.build.result == 'failure' ||
       needs.github-release-draft.result == 'failure' ||
       needs.pypi.result == 'failure' ||
       needs.pypi.result == 'cancelled' ||
       needs.publish-github-release.result == 'failure')
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Explain what happened and what to do
        env:
          TAG: ${{ github.ref_name }}
          BUILD: ${{ needs.build.result }}
          DRAFT: ${{ needs.github-release-draft.result }}
          PYPI: ${{ needs.pypi.result }}
          PUBLISH: ${{ needs.publish-github-release.result }}
        run: |
          set -euo pipefail
          echo "Release $TAG did not complete."
          echo
          printf '  %-24s %s\n' "build" "$BUILD"
          printf '  %-24s %s\n' "github-release-draft" "$DRAFT"
          printf '  %-24s %s\n' "pypi" "$PYPI"
          printf '  %-24s %s\n' "publish-github-release" "$PUBLISH"
          echo

          if [ "$PYPI" = "success" ] && [ "$PUBLISH" != "success" ]; then
            echo "*** PyPI PUBLISH SUCCEEDED, GitHub Release did not finish. ***"
            echo
            echo "  $TAG IS live on PyPI and CANNOT be replaced — PyPI versions are immutable."
            echo
            echo "  DO NOT rebuild. DO NOT move the tag. DO NOT publish a different artifact"
            echo "  under this version."
            echo "  DO: inspect the existing draft release, confirm its attached files match"
            echo "      what PyPI received, then publish it by hand:"
            echo "        gh release view $TAG"
            echo "        gh release edit $TAG --draft=false"
          elif [ "$BUILD" != "success" ]; then
            echo "Nothing was published. The failure happened before any upload."
            echo "Fix the problem on main via a pull request, then create a NEW tag"
            echo "(e.g. the next rc). Never move or reuse a tag that has already been pushed."
          else
            echo "Nothing was published to PyPI."
            echo "Any draft GitHub Release for $TAG is still a draft and is safe to delete:"
            echo "  gh release delete $TAG --yes"
            echo "Then fix the problem on main and create a NEW tag."
          fi

          echo
          echo "Full guidance: see the maintainer release playbook."
          exit 1
