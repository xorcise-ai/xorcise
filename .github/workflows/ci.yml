# Pull-request gate. Runs UNTRUSTED code: any fork PR executes these jobs.
# `pull_request` (never `pull_request_target`) means fork PRs get a read-only token and no
# secrets; no job here references a secret, so there is nothing to exfiltrate.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    # No `labeled`, deliberately.
    #
    # It was here so that adding `full-ci` re-ran the workflow and let the Docker-heavy lanes
    # execute. Two things removed the case for it. #91 made those lanes run on any pull
    # request that changes more than documentation, so `full-ci` is now only needed for a
    # docs-only change that wants them anyway — rare. And `pr-contract` makes a release-note
    # label mandatory on EVERY pull request, so with `labeled` here every pull request would
    # get its whole CI run superseded and restarted the moment that label lands, taking the
    # in-flight run's `ci-ok` down with it (`cancel-in-progress` below) and flipping an
    # already-green pull request back to not-passing for no reason.
    #
    # The cost of dropping it: `full-ci` takes effect on the next push rather than
    # immediately. That is the cheaper side of the trade, and the alternative fix is worse —
    # skipping the expensive jobs on label events would leave a SKIPPED `ci-ok` on the same
    # commit, which a required check counts as passing.
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  # Cancel superseded PR runs, never `main` runs — each of those records whether a commit is green.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinning the action SHA does not pin the tool it installs.
  UV_VERSION: "0.9.30"

jobs:
  # Static quality. Everything depends on this, so a typo fails in ~2 min, not after the suite.
  smoke:
    name: smoke (lint, types, guards)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs reads git tags during the editable install
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      # `--locked` fails on a stale uv.lock, so a dep change without a re-lock cannot merge.
      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Import smoke test
        run: uv run python -c "import xorcise, xorcise.core; print(xorcise.__version__)"

      - name: Type check (mypy, strict)
        run: uv run mypy

      - name: Guard — single distribution
        run: uv run python scripts/check_single_distribution.py

      - name: Guard — import walls (import-linter)
        run: uv run lint-imports

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

  # Fast lanes: no Docker needed. These gate every pull request.
  test:
    name: test (${{ matrix.lane }})
    runs-on: ubuntu-latest
    needs: smoke
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false # one lane failing must not hide the others
      matrix:
        lane: [unit, topology, adapters]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      # Lane travels via `env:`, never interpolated into `run:` — keeps the no-injection rule
      # mechanical and lets zizmor verify it.
      - name: Run lane
        env:
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          args=(-m "$LANE" -v)
          # Only the unit lane is process-isolated (function-scoped temp DBs + stub adapters)
          # and therefore safe under xdist. adapters/topology touch Docker and fixed ports.
          if [ "$LANE" = "unit" ]; then
            args+=(-n auto)
          fi
          uv run pytest "${args[@]}"

  # Does this PR touch anything the Docker-heavy lanes could possibly exercise?
  #
  # Deliberately an INVERSE rule: heavy=true unless EVERY changed file is documentation. A list
  # of paths that must trigger the lanes would have to be kept in sync with what
  # tests/integration and tests/e2e import — which is most of src/xorcise/core — and a list like
  # that desynchronises silently the first time someone adds a module. Skipping is the dangerous
  # direction, so anything unrecognised runs them.
  changes:
    name: changes
    runs-on: ubuntu-latest
    # Runs on EVERY event, deliberately. This job carried `if: github.event_name ==
    # 'pull_request'` for one commit, and a skipped job skips everything that `needs` it
    # whatever the dependant's own `if` says — so on push-to-main `test-heavy` was skipped and
    # `ci-ok`, which requires it there, failed. Guard the event INSIDE the step instead.
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      heavy: ${{ steps.filter.outputs.heavy }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether the heavy lanes are needed
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Anything that is not a pull request (push to main, and any future trigger) runs the
          # lanes unconditionally — there is no "changed files" question to ask.
          if [ "$EVENT" != "pull_request" ]; then
            echo "event=$EVENT — the heavy lanes always run"
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail SAFE: if the diff cannot be computed for any reason, run the lanes.
          if ! files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA"); then
            echo "could not diff $BASE_SHA..$HEAD_SHA — running the heavy lanes"
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          heavy=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              *.md|docs/*|LICENSE|.github/ISSUE_TEMPLATE/*|.github/*.md) ;;
              *) heavy=true ;;
            esac
          done <<EOF
          $files
          EOF
          echo "changed files:"
          printf '%s\n' "$files" | sed 's/^/  /'
          echo "heavy=$heavy"
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"

  # Docker-heavy lanes: real containers, Headscale, FIXED host ports (:3001, the tailnet) —
  # one matrix leg each so they never share a runner.
  #
  # These used to run ONLY on push-to-main, nightly, or an opt-in `full-ci` label, to keep a
  # potentially flaky required check off every PR. The cost of that showed up in #80/#81/#82: a
  # three-PR stack rewriting `up`, `down`, `db upgrade` and the run-create gate went review-ready
  # and green with these lanes never executed — two of the PRs asked for the label in their body
  # and nobody applied it — and the first place they would have run was the merge commit on main.
  #
  # So they now run on any PR that changes something other than documentation (see `changes`).
  # The label is kept as a manual override for a docs-only PR that still wants them. If this
  # does turn out to be flaky in practice, narrow `changes`, do not go back to opt-in: a lane
  # nobody remembers to ask for is a lane that does not run.
  test-heavy:
    name: test-heavy (${{ matrix.lane }})
    runs-on: ubuntu-latest
    needs: [smoke, changes]
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.heavy == 'true' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lane: [integration, e2e]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      # Logged so a skipped Docker test is never mistaken for a passing one.
      - name: Docker environment
        run: |
          docker --version
          docker compose version || echo "NOTE: compose v2 plugin unavailable on this runner"

      - name: Run lane
        env:
          LANE: ${{ matrix.lane }}
        # No xdist: these lanes bind fixed ports and share a Docker daemon.
        run: uv run pytest -m "$LANE" -v

  # Frontend type check + unit tests. The production build is NOT duplicated here —
  # `build-dist` exercises that exact path via the hatch hook, which is what ships.
  frontend:
    name: frontend (typecheck, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci`, not `install`: fails if package.json and the lockfile disagree.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

  # Browser end-to-end against a REAL served surface. Nothing else in CI drives the UI,
  # and the cost of that showed: this suite had been failing for months on four separate
  # rots — a baseURL whose path every root-relative goto() discarded, two headings renamed
  # by the mission/intel vocabulary change, form labels that never existed, and a strict-mode
  # clash with Next's own route announcer. None of it was noticed because nothing ran it.
  #
  # Runs on a FRESH install (no agents, no runs, nothing pulled), which is what a runner
  # gets and what the specs are written against — a suite that needs seeded state is a
  # suite that only ever passes locally.
  frontend-e2e:
    name: frontend (e2e)
    runs-on: ubuntu-latest
    needs: smoke
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Writes the export into the package tree, which is where the server reads it from.
      - name: Build the operator surface
        working-directory: frontend
        run: npm run build:static

      - name: Install the browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # A dedicated XORCISE_HOME keeps the run hermetic: a fresh DB, no inherited config.
      - name: Serve, and drive the UI against it
        env:
          XORCISE_HOME: ${{ runner.temp }}/xorcise-e2e
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
        run: |
          set -euo pipefail
          mkdir -p "$XORCISE_HOME"
          uv run xorcise serve --port 3001 > "$RUNNER_TEMP/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          # Poll rather than sleep — a fixed wait is either flaky or slow.
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/api/health >/dev/null 2>&1; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "::error::server exited before becoming ready"; cat "$RUNNER_TEMP/server.log"; exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3001/api/health >/dev/null \
            || { echo "::error::server never became ready"; cat "$RUNNER_TEMP/server.log"; exit 1; }

          npm --prefix frontend run test:e2e

      # The opposite precondition: the same export served with NO /api behind it, so the
      # shell must show the unreachable banner instead of crashing. Run against a plain
      # file server, with the export under /ui to match how the app is mounted.
      - name: Drive the UI with the API unreachable
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3098
        run: |
          set -euo pipefail
          static_root="$RUNNER_TEMP/ui-static"
          mkdir -p "$static_root/ui"
          cp -r frontend/out/. "$static_root/ui/"
          python3 -m http.server 3098 --bind 127.0.0.1 --directory "$static_root" >/dev/null 2>&1 &
          static_pid=$!
          trap 'kill "$static_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3098/ui/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          npm --prefix frontend run test:e2e:no-server

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # Proves `pip install xorcise` works: runs the real hatch hook (which builds the UI),
  # verifies the wheel actually contains it, installs clean and runs the CLI.
  # Nothing else in CI covers this path.
  build-dist:
    name: build-dist (wheel + sdist)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # a shallow clone silently produces a 0.1.dev0 wheel
          persist-credentials: false

      # Node must exist BEFORE `uv build` — the hook degrades to a stale export without it.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Build sdist + wheel
        run: uv build

      - name: List built artifacts
        run: ls -l dist/

      - name: Verify wheel contents (UI export, role manifest, migrations, mission base)
        run: uv run python scripts/check_wheel_contents.py dist

      - name: Validate package metadata (twine, strict)
        run: uv run twine check --strict dist/*

      # A throwaway venv proves the entry point works; an import-only check would not.
      - name: Install wheel into a clean environment and run the CLI
        run: |
          set -euo pipefail
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/xorcise --help
          /tmp/smoke/bin/xorcise --version || true

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # Audits these workflow files for template injection, credential persistence, over-broad
  # permissions and unpinned actions.
  lint-actions:
    name: lint-actions (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      # zizmor comes from the locked dev extra, not `uvx` — the tool auditing our supply
      # chain must not itself float to latest on every run.
      - name: Audit workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run zizmor --pedantic .github/workflows/

  # The required status check for everything in THIS workflow. The `main` ruleset names this
  # one context rather than the individual lanes, so lanes can be added, split or renamed
  # without touching repository settings — and a renamed leg cannot leave behind a required
  # check that never reports.
  #
  # Not the only required check in the repository: `pr-contract` is a separate workflow with
  # its own context, for the reasons its header gives. See CONTRIBUTING.md.
  #
  # `if: always()` is load-bearing: without it this job would SKIP when a dependency failed,
  # and a skipped required check does NOT block a merge.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    if: always()
    needs: [smoke, changes, test, test-heavy, frontend, frontend-e2e, build-dist, lint-actions]
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify all required jobs succeeded
        env:
          SMOKE: ${{ needs.smoke.result }}
          TEST: ${{ needs.test.result }}
          TEST_HEAVY: ${{ needs.test-heavy.result }}
          FRONTEND: ${{ needs.frontend.result }}
          FRONTEND_E2E: ${{ needs.frontend-e2e.result }}
          BUILD_DIST: ${{ needs.build-dist.result }}
          LINT_ACTIONS: ${{ needs.lint-actions.result }}
          EVENT: ${{ github.event_name }}
          HAS_FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          HEAVY_NEEDED: ${{ needs.changes.outputs.heavy }}
        run: |
          set -uo pipefail
          status=0

          # Always-required jobs: anything other than success (failure, cancelled, or an
          # unexpected skip) fails the gate.
          for entry in \
            "smoke=$SMOKE" \
            "test=$TEST" \
            "frontend=$FRONTEND" \
            "frontend-e2e=$FRONTEND_E2E" \
            "build-dist=$BUILD_DIST" \
            "lint-actions=$LINT_ACTIONS"
          do
            name="${entry%%=*}"
            result="${entry#*=}"
            if [ "$result" = "success" ]; then
              printf 'ok       %-14s %s\n' "$name" "$result"
            else
              printf 'FAILED   %-14s %s\n' "$name" "$result"
              echo "::error::Required job '$name' did not succeed (result: $result)"
              status=1
            fi
          done

          # test-heavy is conditional. It MUST succeed whenever it was supposed to run;
          # `skipped` is only acceptable on a documentation-only pull request that did not ask
          # for it. This condition MIRRORS the `if:` on test-heavy — if the two ever disagree,
          # the gate either demands a job that never ran or waves through one that should have.
          heavy_required=false
          if [ "$EVENT" = "push" ] || [ "$HAS_FULL_CI" = "true" ] || [ "$HEAVY_NEEDED" = "true" ]; then
            heavy_required=true
          fi

          if [ "$TEST_HEAVY" = "success" ]; then
            printf 'ok       %-14s %s\n' "test-heavy" "$TEST_HEAVY"
          elif [ "$TEST_HEAVY" = "skipped" ] && [ "$heavy_required" = "false" ]; then
            printf 'ok       %-14s %s (documentation-only change; add the "full-ci" label to run it anyway)\n' \
              "test-heavy" "$TEST_HEAVY"
          else
            printf 'FAILED   %-14s %s (required=%s)\n' "test-heavy" "$TEST_HEAVY" "$heavy_required"
            echo "::error::Job 'test-heavy' was required for this event but its result was '$TEST_HEAVY'"
            status=1
          fi

          if [ "$status" -ne 0 ]; then
            echo "::error::CI gate failed — see the job results above."
          else
            echo "All required checks passed."
          fi
          exit "$status"
