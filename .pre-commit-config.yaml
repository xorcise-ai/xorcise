repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint --fix)
        entry: uv run ruff check --fix
        language: system
        types: [python]
        exclude: '^missions/'
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        exclude: '^missions/'
        require_serial: true
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        pass_filenames: false
      - id: single-distribution
        name: "single distribution guard"
        entry: uv run python scripts/check_single_distribution.py
        language: system
        pass_filenames: false
      - id: import-linter
        name: "import walls (import-linter)"
        entry: uv run lint-imports
        language: system
        pass_filenames: false
